{% extends 'base.html' %}
{% block title %}ثبت نظر | گلبو{% endblock %}

{% block content %}
<section class="comment-page">
    <div class="container">
        <div class="comment-card">
            <h1>📝 ثبت نظر</h1>
            <p class="comment-sub">نظر، پیشنهاد یا تجربه‌ات رو با ما به اشتراک بذار.</p>

            <form method="post" action="{% url 'plants:submit_comment' %}" class="comment-form" novalidate>
                {% csrf_token %}

                <label for="id_name">نام شما</label>
                <input type="text" id="id_name" name="name" placeholder="مثلاً: امیرعلی" required>

                <label for="id_email">ایمیل (اختیاری)</label>
                <input type="email" id="id_email" name="email" placeholder="you@example.com">

                <label for="id_message">متن نظر</label>
                <textarea id="id_message" name="message" rows="6" placeholder="نظرت رو اینجا بنویس..." required></textarea>

                <div class="comment-actions">
                    <a href="{% url 'plants:landing' %}" class="btn btn-ghost">بازگشت</a>
                    <button type="submit" class="btn btn-primary">ارسال نظر</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
